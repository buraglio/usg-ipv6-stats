name: RouteViews MRT Ingest

# Downloads BGP MRT RIB dumps from a RouteViews collector, parses
# TABLE_DUMP_V2 records, filters to USG-corpus ASNs, and stores
# IPv4/IPv6 prefix records in DuckDB.
#
# Full pipeline:
#   1. Reload USG ASN corpus from committed CSV  → asn_corpus table
#   2. Load CAIDA pfx2as (if not current month)  → caida_pfx2as table
#   3. fetch_rib → parse_mrt → load_parquet      → prefix_records table
#
# DuckDB is too large for git; it lives in the rolling 'data-latest'
# GitHub Release. Each run downloads the existing DB, appends new
# snapshots (already-processed ones are skipped), and re-uploads.
# The upload uses 'if: always()' so partial progress is preserved
# even if a snapshot fails to parse.
#
# For historical backfill use the RouteViews MRT Backfill workflow.

on:
  schedule:
    - cron: '0 10 * * 1'  # weekly, Monday 10:00 UTC
  workflow_dispatch:
    inputs:
      collector:
        description: RouteViews collector (e.g. route-views2, route-views6)
        required: false
        default: route-views2
        type: string
      limit:
        description: Max MRT RIB snapshots to fetch and parse per run
        required: false
        default: '6'
        type: string

permissions:
  contents: write

jobs:
  ingest-mrt:
    name: Fetch and parse RouteViews MRT RIBs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Create data directories
        run: mkdir -p data/raw

      - name: Download existing DuckDB from rolling release
        # continue-on-error so the first-ever run (no release yet) still works
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-latest --pattern '*.duckdb' --dir data/

      - name: Load USG ASN corpus into DuckDB
        # Reloads corpus from the committed CSV so we never hit the ARIN API
        # in this workflow. Run the Corpus Update workflow to refresh the CSV.
        run: |
          if [ -f data/usg_asn_corpus.csv ]; then
            echo "Loading corpus from committed data/usg_asn_corpus.csv ..."
            uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          import csv

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)
          conn.execute('DELETE FROM asn_corpus')

          with open('data/usg_asn_corpus.csv') as f:
              rows = list(csv.DictReader(f))

          conn.executemany(
              'INSERT INTO asn_corpus VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)',
              [(int(r['asn']), r['org_name'], r['agency'], r['tier'],
                r['arin_org_handle'], r['confidence'], r['sources'],
                r['last_verified'], r['corpus_version'])
               for r in rows]
          )
          conn.close()
          print(f'Loaded {len(rows)} ASNs into corpus')
          PYEOF
          else
            echo "No corpus CSV found — building from ARIN + CAIDA (slow; run Corpus Update workflow instead) ..."
            mkdir -p data/raw
            uv run python -m usg_ipv6.corpus.build \
              --db data/usg_ipv6.duckdb \
              --version "$(date +%Y-%m-%d)" \
              --csv data/usg_asn_corpus.csv
          fi

      - name: Load CAIDA prefix-to-ASN data into DuckDB
        # Downloads the latest CAIDA routeviews-prefix2as file and loads it into
        # the caida_pfx2as table. Skipped if data for the current month already
        # exists, so re-runs within the same month don't re-download (~30 MB).
        run: |
          uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          from usg_ipv6.pipeline.caida_pfx2as import download_pfx2as, load_pfx2as
          from datetime import date
          import os, sys

          today = date.today()
          snapshot_date = today.isoformat()
          month_start = today.replace(day=1).isoformat()

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)

          # Check if we already have data for this month
          existing = conn.execute(
              "SELECT COUNT(*) FROM caida_pfx2as WHERE snapshot_date >= ?",
              [month_start],
          ).fetchone()[0]

          if existing > 0:
              print(f"CAIDA pfx2as already loaded for {today.strftime('%Y-%m')} "
                    f"({existing:,} rows) — skipping download")
              conn.close()
              sys.exit(0)

          # Try today, then fall back up to 7 days to handle publishing delays
          downloaded = None
          for days_back in range(8):
              attempt = date.fromordinal(today.toordinal() - days_back)
              try:
                  downloaded = download_pfx2as('data/raw', attempt.isoformat())
                  print(f"Downloaded CAIDA pfx2as for {attempt.isoformat()}")
                  break
              except Exception as e:
                  print(f"  {attempt.isoformat()}: {e}", file=sys.stderr)

          if downloaded is None:
              print("WARNING: Could not download any CAIDA pfx2as file — "
                    "caida_pfx2as table will not be updated this run", file=sys.stderr)
              conn.close()
              sys.exit(0)

          n = load_pfx2as(downloaded, snapshot_date, conn)
          conn.close()
          print(f"Loaded {n:,} CAIDA pfx2as prefix records (snapshot_date={snapshot_date})")
          PYEOF

      - name: Fetch and parse RouteViews MRT RIB snapshots
        # run_incremental downloads each RIB dump (.bz2), parses TABLE_DUMP_V2
        # entries with mrtparse, writes a Parquet file, then normalises prefix
        # records into DuckDB.  Already-processed snapshots are skipped.
        env:
          COLLECTOR: ${{ inputs.collector || 'route-views2' }}
          LIMIT: ${{ inputs.limit || '6' }}
        run: |
          uv run python << 'PYEOF'
          import json, os, sys
          from usg_ipv6.pipeline.runner import run_incremental

          collector = os.environ['COLLECTOR']
          limit     = int(os.environ['LIMIT'])

          print(f"Collector: {collector}  limit: {limit} snapshots")
          result = run_incremental('data/usg_ipv6.duckdb', collector, limit=limit)
          print(json.dumps(result, indent=2))
          if result['processed'] == 0:
              print(
                  'WARNING: 0 new snapshots processed — '
                  'collector may be fully caught up or unreachable',
                  file=sys.stderr,
              )
          else:
              print(f"Ingested {result['processed']} MRT RIB snapshot(s) for {collector}")
          PYEOF

      - name: Upload updated DuckDB to rolling release
        # if: always() preserves corpus + pfx2as progress even if MRT parsing fails
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data-latest data/usg_ipv6.duckdb --clobber \
          || gh release create data-latest data/usg_ipv6.duckdb \
               --title "Data: $(date +%Y-%m-%d)" \
               --notes "Rolling data release — latest RouteViews MRT snapshots for ${{ inputs.collector || 'route-views2' }}." \
               --prerelease
