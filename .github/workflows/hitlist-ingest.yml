name: IPv6 Hitlist Ingest

# Matches responsive IPv6 addresses from the TU Munich IPv6 Hitlist against
# corpus ASN prefixes (from caida_pfx2as rv6).  Runs Friday 07:00 UTC so
# it follows the RouteViews (Monday) and Ark (Wednesday) runs and can use
# the freshest pfx2as IPv6 data.
#
# Requires caida_pfx2as to contain IPv6 (af=6) rows.  If none are present
# the ingest step will exit non-zero with a clear error message.
#
# DuckDB lives in the rolling 'data-latest' GitHub Release.

on:
  schedule:
    - cron: '0 7 * * 5'    # Friday 07:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: Observation date (YYYY-MM-DD). Leave blank for today.
        required: false
        default: ''
        type: string
      since:
        description: Backfill start date (YYYY-MM-DD). Used with `until` for range.
        required: false
        default: ''
        type: string
      until:
        description: Backfill end date (YYYY-MM-DD). Defaults to today when `since` is set.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  hitlist-ingest:
    name: Ingest IPv6 Hitlist responsive addresses
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen --reinstall-package usg-ipv6-stats

      - name: Create data directories
        run: mkdir -p data/raw

      - name: Download existing DuckDB from rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-latest --pattern '*.duckdb' --dir data/ || true

      - name: Load CAIDA pfx2as IPv6 data (rv6) into DuckDB
        # Ensures caida_pfx2as has IPv6 rows before the hitlist match runs.
        # Skipped if af=6 data for the current month already exists.
        run: |
          uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          from usg_ipv6.pipeline.caida_pfx2as import download_pfx2as, load_pfx2as
          from datetime import date
          import sys

          today = date.today()
          month_start = today.replace(day=1).isoformat()

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)

          existing = conn.execute(
              "SELECT COUNT(*) FROM caida_pfx2as WHERE af = 6 AND snapshot_date >= ?",
              [month_start],
          ).fetchone()[0]

          if existing > 0:
              print(f"CAIDA pfx2as IPv6 already loaded for {today.strftime('%Y-%m')} "
                    f"({existing:,} rows) — skipping download")
              conn.close()
              sys.exit(0)

          downloaded = None
          for days_back in range(8):
              from datetime import timedelta
              attempt = date.fromordinal(today.toordinal() - days_back)
              try:
                  downloaded = download_pfx2as('data/raw', attempt.isoformat(), 'rv6')
                  print(f"Downloaded CAIDA pfx2as rv6 for {attempt.isoformat()}")
                  break
              except Exception as e:
                  print(f"  {attempt.isoformat()} rv6: {e}", file=sys.stderr)

          if downloaded is None:
              print("ERROR: Could not download rv6 pfx2as (required for hitlist match).",
                    file=sys.stderr)
              conn.close()
              sys.exit(1)

          n = load_pfx2as(downloaded, today.isoformat(), conn)
          print(f"Loaded {n:,} IPv6 pfx2as records (snapshot_date={today.isoformat()})")
          conn.close()
          PYEOF

      - name: Run Hitlist ingest
        env:
          INPUT_DATE:  ${{ inputs.date }}
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          uv run python << 'PYEOF'
          import json, os, sys
          from datetime import datetime, date
          from usg_ipv6.pipeline.hitlist import run_hitlist_ingest, run_hitlist_backfill

          inp_date  = os.environ.get("INPUT_DATE", "").strip()
          inp_since = os.environ.get("INPUT_SINCE", "").strip()
          inp_until = os.environ.get("INPUT_UNTIL", "").strip()

          if inp_since:
              until_str = inp_until or date.today().isoformat()
              print(f"Backfill: {inp_since} -> {until_str}")
              result = run_hitlist_backfill(
                  "data/usg_ipv6.duckdb",
                  datetime.fromisoformat(inp_since),
                  datetime.fromisoformat(until_str),
              )
          else:
              target = inp_date or None
              print(f"Ingest: date={target or 'today'}")
              result = run_hitlist_ingest("data/usg_ipv6.duckdb", date=target)

          print(json.dumps(result, indent=2))
          PYEOF

      - name: Upload updated DuckDB to rolling release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/usg_ipv6.duckdb ]; then
            echo "No DuckDB to upload."
            exit 0
          fi
          gh release upload data-latest data/usg_ipv6.duckdb --clobber \
          || gh release create data-latest data/usg_ipv6.duckdb \
               --title "Data: $(date +%Y-%m-%d)" \
               --notes "IPv6 Hitlist ingest." \
               --prerelease

      - name: Rebuild GitHub Pages dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml || true
