name: Corpus Update

# Rebuilds the USG ASN corpus from ARIN WHOIS and CAIDA AS2Org.
#
# Scheduled run (weekly):  opens a PR so changes can be reviewed before merge.
# Manual run (workflow_dispatch): commits data/usg_asn_corpus.csv directly to
#   main so the corpus is available immediately — use this for the initial
#   bootstrap and for on-demand refreshes.
#
# After a manual run the updated asn_corpus table is also written into the
# rolling DuckDB release so the GitHub Pages dashboard reflects the new
# agencies immediately, without waiting for the next RouteViews ingest.

on:
  schedule:
    - cron: '0 6 * * 0'   # weekly, Sunday 06:00 UTC
  workflow_dispatch:       # manual trigger — commits directly to main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --reinstall-package usg-ipv6-stats

      - name: Create data directories
        run: mkdir -p data/raw

      - name: Download existing DuckDB from rolling release
        # Preserves prefix_records and other tables — corpus.build only
        # replaces the asn_corpus table, leaving historical data intact.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-latest --pattern '*.duckdb' --dir data/

      - name: Build corpus (ARIN WHOIS + CAIDA AS2Org)
        run: |
          uv run python -m usg_ipv6.corpus.build \
            --db data/usg_ipv6.duckdb \
            --version "$(date +%Y-%m-%d)" \
            --csv data/usg_asn_corpus.csv

      - name: Check for CSV changes
        id: changes
        run: |
          if git diff --quiet data/usg_asn_corpus.csv 2>/dev/null && \
             git ls-files --error-unmatch data/usg_asn_corpus.csv 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "Corpus is already up to date — nothing to commit."

      # Manual trigger: push directly to main so the CSV is available immediately.
      # Pushing to main also fires publish.yml which creates the versioned release.
      - name: Commit and push directly to main (manual trigger)
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usg_asn_corpus.csv
          git commit -m "chore: update USG ASN corpus ${DATE} (manual refresh)"
          git pull --rebase origin main
          git push origin main
          echo "Corpus committed to main. The Publish workflow will create a versioned release."

      # Upload the updated DuckDB so the GitHub Pages dashboard reflects new
      # agencies immediately, without waiting for the next ingest workflow.
      - name: Upload updated DuckDB to rolling release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/usg_ipv6.duckdb ]; then
            echo "No DuckDB to upload — skipping."
            exit 0
          fi
          gh release upload data-latest data/usg_ipv6.duckdb --clobber \
          || gh release create data-latest data/usg_ipv6.duckdb \
               --title "Data: $(date +%Y-%m-%d)" \
               --notes "Corpus update." \
               --prerelease
          echo "DuckDB uploaded to data-latest release."

      # Trigger a pages rebuild so the dashboard reflects the updated corpus.
      - name: Rebuild GitHub Pages dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml || true

      # Scheduled run: open a PR so corpus changes get reviewed before merge.
      - name: Create pull request (scheduled run)
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="corpus-update/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/usg_asn_corpus.csv
          git commit -m "chore: update USG ASN corpus ${DATE}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Corpus update ${DATE}" \
            --body "Automated weekly corpus refresh from ARIN WHOIS and CAIDA AS2Org.

          Review the diff in \`data/usg_asn_corpus.csv\` before merging:
          - New ASNs added to the corpus
          - ASNs removed or reclassified
          - Confidence level changes

          Do not merge if any removals look incorrect — flag for manual verification." \
            --base main \
            --head "$BRANCH"
