name: RIPE Atlas Prefix Sweep

# Probes USG IPv6 corpus prefixes using RIPE Atlas to discover live
# addresses that evade ICMP-based probing (hitlist, Ark) due to firewall
# policy.
#
# Deferred collection architecture (no in-process wait, no CI timeout):
#   Each weekly run has two phases:
#     1. COLLECT — fetch results for measurements submitted last week,
#                  store observations in atlas_observations.
#     2. SUBMIT  — queue this week's batch (oldest-probed prefixes first),
#                  write measurement IDs to atlas_pending_measurements,
#                  return immediately.
#   Atlas one-off measurements complete in minutes; one week is more than
#   enough before collection.  No sleep, no timeout risk.
#
# Requires: RIPE_ATLAS_API_KEY secret with "Create measurements" scope.
# DuckDB lives in the rolling 'data-latest' GitHub Release.
#
# Credit estimate (defaults: 100 prefixes, 5 targets, 5 probes, ping+traceroute):
#   ping:       100 x 5 x 5 x  1 =  2,500 credits/run
#   traceroute: 100 x 5 x 5 x 10 = 25,000 credits/run
#   Total: ~27,500 credits/run.  ~530 corpus prefixes cycle fully in ~6 weekly runs.

on:
  schedule:
    - cron: '0 10 * * 6'    # Saturday 10:00 UTC
  workflow_dispatch:
    inputs:
      probe_count:
        description: Atlas probes per measurement (default 5).
        required: false
        default: '5'
        type: string
      country_code:
        description: ISO 3166-1 probe country (default US).
        required: false
        default: 'US'
        type: string
      measurement_labels:
        description: |
          Comma-separated measurement types. Valid: ping, traceroute, tcp_443, tcp_80, tcp_53.
          Default: ping,traceroute
        required: false
        default: 'ping,traceroute'
        type: string
      prefix_batch_size:
        description: Prefixes to sweep per run (default 100; full corpus ~530).
        required: false
        default: '100'
        type: string
      dry_run:
        description: |
          If true, estimate credits only — no measurements created, no credits consumed.
        required: false
        default: 'false'
        type: string
      observation_date:
        description: Override observation date (YYYY-MM-DD). Leave blank for today.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  atlas-sweep:
    name: RIPE Atlas corpus IPv6 prefix sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen --reinstall-package usg-ipv6-stats

      - name: Create data directories
        run: mkdir -p data/raw

      - name: Download existing DuckDB from rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-latest --pattern '*.duckdb' --dir data/ || true

      - name: Verify CAIDA pfx2as IPv6 data is present
        run: |
          uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          from usg_ipv6.pipeline.caida_pfx2as import download_pfx2as, load_pfx2as
          from datetime import date, timedelta
          import sys

          today = date.today()
          month_start = today.replace(day=1).isoformat()

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)

          existing = conn.execute(
              "SELECT COUNT(*) FROM caida_pfx2as WHERE af = 6 AND snapshot_date >= ?",
              [month_start],
          ).fetchone()[0]

          if existing > 0:
              print(f"CAIDA pfx2as IPv6 present ({existing:,} rows) — OK")
              conn.close()
              sys.exit(0)

          print("Fetching CAIDA pfx2as rv6...", file=sys.stderr)
          downloaded = None
          for days_back in range(8):
              attempt = date.fromordinal(today.toordinal() - days_back)
              try:
                  downloaded = download_pfx2as('data/raw', attempt.isoformat(), 'rv6')
                  print(f"Downloaded rv6 for {attempt.isoformat()}")
                  break
              except Exception as e:
                  print(f"  {attempt.isoformat()} rv6: {e}", file=sys.stderr)

          if downloaded is None:
              print("ERROR: Could not download rv6 pfx2as.", file=sys.stderr)
              conn.close()
              sys.exit(1)

          n = load_pfx2as(downloaded, today.isoformat(), conn)
          print(f"Loaded {n:,} IPv6 pfx2as records")
          conn.close()
          PYEOF

      - name: Estimate Atlas credit cost
        env:
          INPUT_PROBE_COUNT:        ${{ inputs.probe_count || '5' }}
          INPUT_MEASUREMENT_LABELS: ${{ inputs.measurement_labels || 'ping,traceroute' }}
          INPUT_PREFIX_BATCH_SIZE:  ${{ inputs.prefix_batch_size || '100' }}
        run: |
          uv run python << 'PYEOF'
          import os
          from usg_ipv6.db import get_connection, init_schema
          from usg_ipv6.pipeline.ripe_atlas import estimate_credits, _PROBE_OFFSETS

          probe_count  = int(os.environ.get("INPUT_PROBE_COUNT", "5") or "5")
          batch_size   = int(os.environ.get("INPUT_PREFIX_BATCH_SIZE", "100") or "100")
          label_str    = os.environ.get("INPUT_MEASUREMENT_LABELS", "ping").strip()
          labels       = [l.strip() for l in label_str.split(",")] if label_str else None

          conn = get_connection("data/usg_ipv6.duckdb")
          init_schema(conn)
          total_prefixes = conn.execute("""
              SELECT COUNT(DISTINCT c.prefix)
              FROM caida_pfx2as c JOIN asn_corpus ac ON ac.asn = c.asn
              WHERE c.af = 6
                AND c.snapshot_date = (SELECT MAX(snapshot_date) FROM caida_pfx2as WHERE af = 6)
          """).fetchone()[0]
          pending_count = conn.execute(
              "SELECT COUNT(*) FROM atlas_pending_measurements WHERE collected = FALSE"
          ).fetchone()[0]
          conn.close()

          run_prefixes = min(batch_size, total_prefixes)
          est = estimate_credits(run_prefixes, len(_PROBE_OFFSETS), probe_count, labels)
          runs_to_full = -(-total_prefixes // batch_size)

          print(f"Pending uncollected measurements: {pending_count:,}")
          print(f"Total corpus prefixes:            {total_prefixes:,}")
          print(f"This run batch:                   {run_prefixes:,}")
          print(f"Probes/measurement:               {probe_count}")
          print(f"Measurement types:                {labels or ['ping']}")
          print(f"Estimated credits (submit):       {est:,}")
          print(f"Runs to full corpus coverage:     {runs_to_full}")
          PYEOF

      - name: Phase 1 — Collect pending Atlas results
        env:
          RIPE_ATLAS_API_KEY: ${{ secrets.RIPE_ATLAS_API_KEY }}
          INPUT_DRY_RUN:      ${{ inputs.dry_run || 'false' }}
        run: |
          uv run python << 'PYEOF'
          import json, os, sys
          from usg_ipv6.pipeline.ripe_atlas import collect_pending_results

          api_key = os.environ.get("RIPE_ATLAS_API_KEY", "").strip()
          dry_run = os.environ.get("INPUT_DRY_RUN", "false").lower() == "true"

          if not api_key:
              print("ERROR: RIPE_ATLAS_API_KEY secret is not set.", file=sys.stderr)
              sys.exit(1)

          if dry_run:
              print("Dry run — skipping collection phase.")
              sys.exit(0)

          result = collect_pending_results(
              db_path="data/usg_ipv6.duckdb",
              api_key=api_key,
          )
          print(json.dumps(result, indent=2))
          print(f"\nCollected {result['collected']} measurements "
                f"({result.get('unique_responsive_addresses', 0)} unique responsive addresses, "
                f"{result.get('unique_hop_addresses', 0)} hop addresses).")
          PYEOF

      - name: Phase 2 — Submit new Atlas measurements
        env:
          RIPE_ATLAS_API_KEY:       ${{ secrets.RIPE_ATLAS_API_KEY }}
          INPUT_PROBE_COUNT:        ${{ inputs.probe_count || '5' }}
          INPUT_COUNTRY_CODE:       ${{ inputs.country_code || 'US' }}
          INPUT_MEASUREMENT_LABELS: ${{ inputs.measurement_labels || 'ping,traceroute' }}
          INPUT_PREFIX_BATCH_SIZE:  ${{ inputs.prefix_batch_size || '100' }}
          INPUT_DRY_RUN:            ${{ inputs.dry_run || 'false' }}
          INPUT_OBSERVATION_DATE:   ${{ inputs.observation_date }}
        run: |
          uv run python << 'PYEOF'
          import json, os, sys
          from datetime import date
          from usg_ipv6.pipeline.ripe_atlas import submit_prefix_sweep

          api_key      = os.environ.get("RIPE_ATLAS_API_KEY", "").strip()
          probe_count  = int(os.environ.get("INPUT_PROBE_COUNT",      "5")   or "5")
          batch_size   = int(os.environ.get("INPUT_PREFIX_BATCH_SIZE", "100") or "100")
          country_code = os.environ.get("INPUT_COUNTRY_CODE", "US").strip() or "US"
          label_str    = os.environ.get("INPUT_MEASUREMENT_LABELS", "ping").strip()
          labels       = [l.strip() for l in label_str.split(",")] if label_str else None
          dry_run      = os.environ.get("INPUT_DRY_RUN", "false").lower() == "true"
          obs_date_str = os.environ.get("INPUT_OBSERVATION_DATE", "").strip()
          obs_date     = date.fromisoformat(obs_date_str) if obs_date_str else None

          if not api_key:
              print("ERROR: RIPE_ATLAS_API_KEY secret is not set.", file=sys.stderr)
              sys.exit(1)

          result = submit_prefix_sweep(
              db_path="data/usg_ipv6.duckdb",
              api_key=api_key,
              observation_date=obs_date,
              probe_count=probe_count,
              country_code=country_code,
              measurement_labels=labels,
              prefix_batch_size=batch_size,
              dry_run=dry_run,
          )
          print(json.dumps(result, indent=2))

          if result.get("dry_run"):
              print("\nDry run — no measurements created.")
          else:
              n = result.get("measurements_submitted", 0)
              print(f"\nSubmitted {n} measurements. Results will be collected next run.")
          PYEOF

      - name: Upload updated DuckDB to rolling release
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/usg_ipv6.duckdb ]; then
            echo "No DuckDB to upload."
            exit 0
          fi
          gh release upload data-latest data/usg_ipv6.duckdb --clobber \
          || gh release create data-latest data/usg_ipv6.duckdb \
               --title "Data: $(date +%Y-%m-%d)" \
               --notes "RIPE Atlas sweep (deferred collection)." \
               --prerelease

      - name: Rebuild GitHub Pages dashboard
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml || true
