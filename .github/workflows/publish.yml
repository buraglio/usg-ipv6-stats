name: Publish

# Runs on every push to main. Creates a versioned release of the corpus CSV
# and (once built) deploys the GitHub Pages web UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-corpus:
    name: Publish corpus artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish versioned corpus release
        if: hashFiles('data/usg_asn_corpus.csv') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TAG="corpus-${DATE}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          # Create release only if tag doesn't already exist
          if gh release view "$TAG" &>/dev/null; then
            echo "Release ${TAG} already exists — skipping."
          else
            gh release create "$TAG" data/usg_asn_corpus.csv \
              --title "USG ASN Corpus ${DATE}" \
              --notes "Versioned corpus snapshot at commit ${SHORT_SHA}.

          This file maps US Government Autonomous System Numbers to federal agencies.
          Generated from ARIN WHOIS and CAIDA AS2Org; see README for methodology." \
              --latest=false
            echo "Created corpus release ${TAG}"
          fi

      - name: No corpus CSV found
        if: hashFiles('data/usg_asn_corpus.csv') == ''
        run: |
          echo "data/usg_asn_corpus.csv not present — run 'make corpus' or trigger the Corpus Update workflow first."

