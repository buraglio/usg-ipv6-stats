name: RouteViews MRT Backfill

# Historical ingest of RouteViews BGP MRT RIB dumps.
#
# Full pipeline:
#   1. Reload USG ASN corpus from committed CSV  → asn_corpus table
#   2. Load CAIDA pfx2as (current snapshot)      → caida_pfx2as table
#   3. fetch_rib → parse_mrt → load_parquet      → prefix_records table
#
# Note: step 2 loads the *current* pfx2as file as a reference dataset.
# For date-accurate historical pfx2as mapping, load historical files
# manually with usg_ipv6.pipeline.caida_pfx2as.load_pfx2as.
# Orchestrated by: usg_ipv6/pipeline/runner.py::run_backfill
#
# RouteViews publishes a RIB snapshot every 2 hours (0000, 0200, …, 2200 UTC),
# so a full year covers ~4 380 snapshots per collector.
#
# Resumability: processed snapshots are recorded in DuckDB and skipped on
# re-runs, so long backfills survive the 6-hour GitHub Actions job limit —
# just trigger the workflow again and it picks up where it left off.

on:
  workflow_dispatch:
    inputs:
      since:
        description: Start date (YYYY-MM-DD)
        required: true
        default: '2021-01-01'
        type: string
      until:
        description: End date (YYYY-MM-DD, leave blank for today)
        required: false
        default: ''
        type: string
      collector:
        description: RouteViews collector (e.g. route-views2, route-views6)
        required: false
        default: route-views2
        type: string

permissions:
  contents: write

jobs:
  backfill-mrt:
    name: Backfill RouteViews MRT RIBs
    runs-on: ubuntu-latest
    timeout-minutes: 350   # just under GitHub's 6-hour job limit; re-trigger to continue
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Create data directories
        run: mkdir -p data/raw

      - name: Download existing DuckDB from rolling release
        # continue-on-error so the first-ever run (no release yet) still works
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-latest --pattern '*.duckdb' --dir data/

      - name: Load USG ASN corpus into DuckDB
        # Reloads corpus from the committed CSV so we never hit the ARIN API
        # during backfill.  Run the Corpus Update workflow to refresh the CSV.
        run: |
          if [ -f data/usg_asn_corpus.csv ]; then
            echo "Loading corpus from committed data/usg_asn_corpus.csv ..."
            uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          import csv

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)
          conn.execute('DELETE FROM asn_corpus')

          with open('data/usg_asn_corpus.csv') as f:
              rows = list(csv.DictReader(f))

          conn.executemany(
              'INSERT INTO asn_corpus VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)',
              [(int(r['asn']), r['org_name'], r['agency'], r['tier'],
                r['arin_org_handle'], r['confidence'], r['sources'],
                r['last_verified'], r['corpus_version'])
               for r in rows]
          )
          conn.close()
          print(f'Loaded {len(rows)} ASNs into corpus')
          PYEOF
          else
            echo "No corpus CSV found — building from ARIN + CAIDA ..."
            uv run python -m usg_ipv6.corpus.build \
              --db data/usg_ipv6.duckdb \
              --version "$(date +%Y-%m-%d)" \
              --csv data/usg_asn_corpus.csv
          fi

      - name: Load CAIDA prefix-to-ASN data into DuckDB
        # Loads the latest available CAIDA pfx2as snapshot as a corroborating
        # reference dataset.  Skipped if data for the current month already
        # exists (avoids re-downloading on re-triggers within the same month).
        run: |
          uv run python << 'PYEOF'
          from usg_ipv6.db import get_connection, init_schema
          from usg_ipv6.pipeline.caida_pfx2as import download_pfx2as, load_pfx2as
          from datetime import date
          import sys

          today = date.today()
          snapshot_date = today.isoformat()
          month_start = today.replace(day=1).isoformat()

          conn = get_connection('data/usg_ipv6.duckdb')
          init_schema(conn)

          existing = conn.execute(
              "SELECT COUNT(*) FROM caida_pfx2as WHERE snapshot_date >= ?",
              [month_start],
          ).fetchone()[0]

          if existing > 0:
              print(f"CAIDA pfx2as already loaded for {today.strftime('%Y-%m')} "
                    f"({existing:,} rows) — skipping download")
              conn.close()
              sys.exit(0)

          downloaded = None
          for days_back in range(8):
              attempt = date.fromordinal(today.toordinal() - days_back)
              try:
                  downloaded = download_pfx2as('data/raw', attempt.isoformat())
                  print(f"Downloaded CAIDA pfx2as for {attempt.isoformat()}")
                  break
              except Exception as e:
                  print(f"  {attempt.isoformat()}: {e}", file=sys.stderr)

          if downloaded is None:
              print("WARNING: Could not download any CAIDA pfx2as file — "
                    "caida_pfx2as table will not be updated this run", file=sys.stderr)
              conn.close()
              sys.exit(0)

          n = load_pfx2as(downloaded, snapshot_date, conn)
          conn.close()
          print(f"Loaded {n:,} CAIDA pfx2as prefix records (snapshot_date={snapshot_date})")
          PYEOF

      - name: Resolve date range
        id: dates
        run: |
          SINCE="${{ inputs.since }}"
          UNTIL="${{ inputs.until }}"
          if [ -z "$UNTIL" ]; then
            UNTIL=$(date +%Y-%m-%d)
          fi
          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "until=${UNTIL}" >> "$GITHUB_OUTPUT"
          echo "Backfill range: ${SINCE} → ${UNTIL} (collector: ${{ inputs.collector || 'route-views2' }})"

      - name: Fetch and parse historical MRT RIB snapshots
        # run_backfill iterates every 2-hour slot in [since, until], downloads
        # the corresponding RouteViews archive RIB dump, parses TABLE_DUMP_V2
        # records with mrtparse, writes Parquet, then loads prefix records into
        # DuckDB.  Snapshots already in the DB are skipped automatically.
        run: |
          SINCE="${{ steps.dates.outputs.since }}"
          UNTIL="${{ steps.dates.outputs.until }}"
          COLLECTOR="${{ inputs.collector || 'route-views2' }}"
          uv run python << PYEOF
          from usg_ipv6.pipeline.runner import run_backfill
          from datetime import datetime
          import json

          print(f"Backfilling MRT RIBs: collector=${COLLECTOR}  {SINCE} → ${UNTIL}")
          result = run_backfill(
              'data/usg_ipv6.duckdb',
              '${COLLECTOR}',
              since=datetime.fromisoformat('${SINCE}'),
              until=datetime.fromisoformat('${UNTIL}'),
          )
          print(json.dumps(result, indent=2))
          print(
              f"Processed {result['processed']} MRT RIB snapshot(s) for "
              f"${COLLECTOR} ({SINCE} → ${UNTIL})"
          )
          PYEOF

      - name: Upload updated DuckDB (always — preserves partial progress)
        # if: always() ensures we upload even if the job hits the 6-hour limit
        # or a snapshot fails to parse.  Re-trigger the workflow to continue.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/usg_ipv6.duckdb ]; then
            echo "No DuckDB to upload — nothing was processed."
            exit 0
          fi
          gh release upload data-latest data/usg_ipv6.duckdb --clobber \
          || gh release create data-latest data/usg_ipv6.duckdb \
               --title "Data: $(date +%Y-%m-%d)" \
               --notes "Backfill (${{ inputs.collector || 'route-views2' }}): ${{ steps.dates.outputs.since }} → ${{ steps.dates.outputs.until }}." \
               --prerelease \
               --tag data-latest
